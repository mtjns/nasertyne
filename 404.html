<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Stránka nebyla nalezena | Naše Rtyně" />
    <meta name="author" content="Naše Rtyně" />
    <meta name="robots" content="noindex, follow" />
    <title>404 - Stránka nebyla nalezena | Naše Rtyně</title>

    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg" />

    <!-- Font Awesome icons -->
    <script defer src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Preconnect to Google fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google fonts -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet"
        type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700&display=swap" rel="stylesheet"
        type="text/css" />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="style.css" rel="stylesheet" />
    <!-- Custom Overrides -->
    <link href="custom.css" rel="stylesheet" />

    <style>
        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .error-content {
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #ffc800;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-heading {
            font-size: 2.5rem;
            font-weight: 700;
            color: #212529;
            margin-bottom: 1rem;
            font-family: "Montserrat", sans-serif;
            text-transform: uppercase;
        }

        .error-description {
            font-size: 1.25rem;
            color: #6c757d;
            margin-bottom: 2rem;
            font-family: "Roboto Slab", serif;
        }

        .error-icon {
            font-size: 4rem;
            color: #ffc800;
            margin-bottom: 1rem;
        }

        .btn-back {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #ffc800;
            color: #212529;
            text-decoration: none;
            border-radius: 0.25rem;
            font-weight: 700;
            font-family: "Montserrat", sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 2px solid #ffc800;
        }

        .btn-back:hover {
            background-color: #e6b400;
            border-color: #e6b400;
            color: #fff;
            text-decoration: none;
        }

        .nav-link-back {
            margin-top: 1rem;
        }

        .nav-link-back a {
            color: #212529;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .nav-link-back a:hover {
            color: #ffc800;
        }
    </style>
</head>

<body id="page-top">
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-heading">Stránka nebyla nalezena</h1>
            <p class="error-description">Stránka kterou, hledáte neexistuje, nebo byla přesunuta.</p>
            <a href="/" class="btn-back">Zpět na hlavní stránku</a>
        </div>
    </div>
</body>

</html>
